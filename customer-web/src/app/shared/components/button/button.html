<button [type]="type()" [disabled]="disabled() || loading()" [class]="buttonClasses"
    [attr.aria-label]="ariaLabel() || null" [attr.aria-busy]="loading()" (click)="onClick($event)">
    @if (loading()) {

    <app-loader [size]="18" [borderSize]="2" color="#ffffff" label="Loading" />

    } @else {

    <span class="button-content">
        <ng-content />
    </span>

    }
</button>

<div class="breadcrumb">
    @for (crumb of breadcrumbs; track crumb.url; let last = $last) {

    @if (!last) {
    <a [routerLink]="crumb.url">
        {{ crumb.label }}
    </a>

    <span class="separator">/</span>
    } @else {
    <span class="current">
        {{ crumb.label }}
    </span>
    }

    }
</div>

<div class="loader-wrapper" [class.overlay]="overlay()" [attr.role]="overlay() ? 'status' : null"
    [attr.aria-label]="label()" [attr.aria-live]="overlay() ? 'polite' : null">
    <span class="spinner" [style.width.px]="size()" [style.height.px]="size()" [style.border-width.px]="borderSize()"
        aria-hidden="true"></span>

    @if (text()) {
    <span class="loader-text">
        {{ text() }}
    </span>
    }
</div>

<header class="header">
    <div class="container">

        <div class="left">

            <a class="logo" routerLink="/" aria-label="Feasto home">
                Feasto
            </a>

            <div class="search">

                <div class="location-box">
                    <app-location-picker />
                </div>

                <div class="restaurant-box">
                    <app-restaurant-picker />
                </div>

            </div>

        </div>

        <nav class="nav" aria-label="Main navigation">

            @if (authInitialized$ | async) {

            @let user = user$ | async;

            @if (user) {

            <div class="profile-menu" appClickOutside (clickOutside)="closeProfileMenu()">

                <button type="button" class="profile-trigger" aria-label="Open profile menu" aria-haspopup="menu"
                    [attr.aria-expanded]="profileMenuOpen" (click)="toggleProfileMenu()">
                    <span class="avatar" aria-hidden="true">
                        {{ user.name?.charAt(0) }}
                    </span>
                </button>

                @if (profileMenuOpen) {
                <div class="profile-dropdown" role="menu">

                    <button type="button" class="profile-menu-item" role="menuitem"
                        (click)="goToProfile(); closeProfileMenu()">
                        <fa-icon [icon]="faUser"></fa-icon>
                        <span>Profile</span>
                    </button>

                    <div class="profile-divider"></div>

                    <button type="button" class="profile-menu-item logout" role="menuitem"
                        (click)="logout(); closeProfileMenu()">
                        <fa-icon [icon]="faRightFromBracket"></fa-icon>
                        <span>Log out</span>
                    </button>

                </div>
                }

            </div>

            } @else {

            <app-button variant="text" size="md" weight="medium" tone="muted">
                Support
            </app-button>

            <app-button variant="primary" size="md" weight="semibold" (clicked)="openAuth.emit()">
                Log in
            </app-button>

            }

            }

        </nav>

    </div>
</header>

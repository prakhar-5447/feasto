<a class="restaurant-card" [routerLink]="[
        '/india',
       city(),
        'r',
        restaurant.restaurant.slug
    ]">
    <div class="image">

        <img [src]="restaurant.image" [alt]="restaurant.name" width="640" height="360" loading="lazy"
            decoding="async" />

        <div class="gradient" aria-hidden="true"></div>

        @if (restaurant.offer) {
        <div class="offer">

            <svg lucideBadgePercent class="icon" aria-hidden="true"></svg>

            <span>
                {{ restaurant.offer }}
            </span>

        </div>
        }

    </div>


    <div class="info">

        <h3>
            {{ restaurant.restaurant.name }}
        </h3>

        <p class="cuisine">
            {{ restaurant.cuisine }}
        </p>


        <div class="meta">

            <span class="rating">
                <svg lucideStar class="icon" aria-hidden="true"></svg>

                <span>
                    {{ restaurant.rating }}
                </span>
            </span>


            <span class="time">

                <svg lucideClock class="icon" aria-hidden="true"></svg>

                <span>
                    {{ restaurant.estimatedDeliveryTime }} min
                </span>

            </span>

        </div>


        <div class="meta-bottom">

            <span>
                &#x20B9;{{ restaurant.priceForTwo }} for one
            </span>

            <span>
                {{ restaurant.distance }} km
            </span>

        </div>

    </div>

</a>

<a class="restaurant-card" [routerLink]="[
        '/india',
       city(),
        'r',
        restaurant.restaurant.slug
    ]">
    <div class="image">

        <img [src]="restaurant.image" [alt]="restaurant.name" width="640" height="360" loading="lazy"
            decoding="async" />

        <div class="gradient" aria-hidden="true"></div>

        @if (restaurant.offer) {
        <div class="offer">

            <fa-icon [icon]="faTag" aria-hidden="true"></fa-icon>

            <span>
                {{ restaurant.offer }}
            </span>

        </div>
        }

    </div>


    <div class="info">

        <h3>
            {{ restaurant.name }}
        </h3>

        <p class="cuisine">
            {{ restaurant.cuisines }}
        </p>


        <div class="meta">

            <span class="rating">
                <fa-icon [icon]="faStar" aria-hidden="true"></fa-icon>

                <span>
                    {{ restaurant.rating }}
                </span>
            </span>


            <span class="time">

                <fa-icon [icon]="faClock" aria-hidden="true"></fa-icon>

                <span>
                    {{ restaurant.deliveryTime }}
                </span>

            </span>

        </div>


        <div class="meta-bottom">

            <span>
                &#x20B9;{{ restaurant.priceForTwo }} for two
            </span>

            <span>
                {{ restaurant.distance }}
            </span>

        </div>

    </div>

</a>

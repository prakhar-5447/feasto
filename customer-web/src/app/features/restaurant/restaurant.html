<div class="page">

    @if (restaurant(); as restaurant) {

    @if (showCarousel()) {
    <app-image-carousel [images]="restaurant.images" />
    }

    <div class="details">
        <app-restaurant-info [restaurantInfo]="this.restaurant()" />
    </div>

    }

    <div class="tabs">

        <button routerLink="order" (click)="setTab('order')" [class.active]="activeTab() === 'order'">
            Order
        </button>

        <button routerLink="reviews" (click)="setTab('reviews')" [class.active]="activeTab() === 'reviews'">
            Reviews
        </button>

        <button routerLink="cart" (click)="setTab('cart')" [class.active]="activeTab() === 'cart'">
            Cart ({{ itemCount() }})
        </button>

    </div>

    <router-outlet />

</div>

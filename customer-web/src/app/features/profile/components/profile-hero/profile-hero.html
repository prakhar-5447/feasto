<section class="profile-hero">
    <div class="container">
        <div class="hero-content">
            <div class="hero-avatar">
                <img [src]="user.avatar" [alt]="user.name" />
                <button type="button" class="avatar-action" aria-label="Change profile photo">
                    <svg lucideCamera class="icon" aria-hidden="true"></svg>
                </button>
            </div>

            <div class="hero-user">
                <h1>{{ user.name }}</h1>
                <p>{{ user.email }}</p>
            </div>

            <div class="hero-stats">
                <div class="stat">
                    <strong>{{ ordersCount }}</strong>
                    <span>Orders</span>
                </div>
                <div class="stat">
                    <strong>{{ reviewsCount }}</strong>
                    <span>Reviews</span>
                </div>
                <div class="stat">
                    <strong>{{ favoritesCount }}</strong>
                    <span>Saved</span>
                </div>
            </div>
        </div>
    </div>
</section>

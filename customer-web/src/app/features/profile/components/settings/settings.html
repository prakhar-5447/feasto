<section class="section-stack">
    <article class="card settings-card">
        <p class="settings-title">
            <svg lucideLock class="icon" aria-hidden="true"></svg>
            Security
        </p>

        <button type="button">
            Change Password
            <svg lucideChevronRight class="icon" aria-hidden="true"></svg>
        </button>

        <button type="button">
            Two-Factor Authentication
            <svg lucideChevronRight class="icon" aria-hidden="true"></svg>
        </button>

        <button type="button">
            Active Sessions
            <svg lucideChevronRight class="icon" aria-hidden="true"></svg>
        </button>
    </article>

    <article class="card settings-card">
        <p class="settings-title">
            <svg lucideGlobe class="icon" aria-hidden="true"></svg>
            Preferences
        </p>

        <div class="setting-row">
            <span>Language</span>
            <select>
                <option>English</option>
                <option>Hindi</option>
                <option>Kannada</option>
            </select>
        </div>

        <div class="setting-row">
            <span>Currency</span>
            <select>
                <option>INR (₹)</option>
                <option>USD ($)</option>
            </select>
        </div>
    </article>

    <article class="card danger-card">
        <p class="danger-title">Danger Zone</p>

        <button type="button">
            Delete Account
            <svg lucideChevronRight class="icon" aria-hidden="true"></svg>
        </button>

        <button type="button" class="logout-button" (click)="logout.emit()">
            <span>
                <svg lucideLogOut class="icon" aria-hidden="true"></svg>
                Log Out
            </span>
            <svg lucideChevronRight class="icon" aria-hidden="true"></svg>
        </button>
    </article>
</section>

<section class="section-stack">
    @for (review of reviews; track review.id) {
    <article class="card review-card">
        <div class="review-thumb">
            <img [src]="review.restaurantImage" [alt]="review.restaurantName" />
        </div>

        <div class="review-content">
            <div class="review-heading">
                <strong>{{ review.restaurantName }}</strong>
                <span>{{ review.date }}</span>
            </div>

            <div class="stars">
                @for (star of stars(review.rating); track star) {
                <svg lucideStar class="icon filled" aria-hidden="true"></svg>
                }
                @for (star of emptyStars(review.rating); track star) {
                <svg lucideStar class="icon empty" aria-hidden="true"></svg>
                }
            </div>

            <p>{{ review.comment }}</p>

            <div class="review-actions">
                <button type="button"> <svg lucideSquarePen class="icon" aria-hidden="true"></svg>Edit</button>
                <button type="button" class="danger"> <svg lucideTrash class="icon empty" aria-hidden="true"></svg>
                    Delete</button>
            </div>
        </div>
    </article>
    }
</section>

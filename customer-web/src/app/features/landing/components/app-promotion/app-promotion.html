<section class="app-promotion" aria-labelledby="app-promotion-title">
    <div class="container">
        <div class="promotion-grid">

            <div class="content">

                <div class="badge" aria-hidden="true">
                    <fa-icon [icon]="faMobile"></fa-icon>
                    <span>Download Our App</span>
                </div>

                <h2 id="app-promotion-title">
                    Get the Feasto App for Better Experience
                </h2>

                <p>
                    Download our mobile app and get exclusive deals,
                    faster checkout, and real-time order tracking.
                </p>

                <div class="download-buttons">

                    <a class="store-btn" href="#" aria-label="Download Feasto on the App Store">
                        <fa-icon [icon]="faDownload" aria-hidden="true"></fa-icon>

                        <span class="store-text">
                            <span class="small">
                                Download on the
                            </span>

                            <span class="big">
                                App Store
                            </span>
                        </span>
                    </a>

                    <a class="store-btn" href="#" aria-label="Get Feasto on Google Play">
                        <fa-icon [icon]="faDownload" aria-hidden="true"></fa-icon>

                        <span class="store-text">
                            <span class="small">
                                Get it on
                            </span>

                            <span class="big">
                                Google Play
                            </span>
                        </span>
                    </a>

                </div>

            </div>

            <div class="image">
                <img src="https://images.unsplash.com/photo-1615642036791-a9fa3dc117b2?auto=format&fit=crop&q=80&w=800"
                    srcset="
                        https://images.unsplash.com/photo-1615642036791-a9fa3dc117b2?auto=format&fit=crop&q=80&w=480 480w,
                        https://images.unsplash.com/photo-1615642036791-a9fa3dc117b2?auto=format&fit=crop&q=80&w=800 800w
                    " sizes="(max-width: 767px) 0px, 50vw" width="800" height="800" loading="lazy" decoding="async"
                    alt="Delivery person using the Feasto food delivery app" />
            </div>

        </div>
    </div>
</section>

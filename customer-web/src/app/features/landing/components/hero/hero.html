<section class="hero">
    <div class="container">
        <div class="hero-grid">

            <div class="hero-content">

                <h1 class="hero-title">
                    Order Food from Your Favorite
                    <span class="highlight">Restaurants</span>
                </h1>

                <p class="hero-description">
                    Discover the best restaurants near you.
                    Fast delivery, fresh food, and amazing deals!
                </p>

                <form class="hero-search" aria-label="Find food" (ngSubmit)="findFood()">

                    <div class="search-box">

                        <div class="search-field location">

                            <fa-icon [icon]="faLocationDot" aria-hidden="true"></fa-icon>

                            <label class="sr-only" for="delivery-location">
                                Delivery location
                            </label>

                            <input id="delivery-location" name="deliveryLocation" type="text"
                                placeholder="Enter your delivery location" autocomplete="off"
                                [(ngModel)]="locationQuery" />

                        </div>
                    </div>

                    <app-button type="submit" variant="primary" size="lg" aria-label="find food"
                        data-testid="find-button">
                        Find Food
                    </app-button>

                </form>

            </div>

            <div class="hero-image">

                <img src="https://images.unsplash.com/photo-1617194191528-9a50cf609304?crop=entropy&cs=tinysrgb&fit=crop&q=80&w=1080"
                    srcset="
                        https://images.unsplash.com/photo-1617194191528-9a50cf609304?crop=entropy&cs=tinysrgb&fit=crop&q=80&w=480 480w,
                        https://images.unsplash.com/photo-1617194191528-9a50cf609304?crop=entropy&cs=tinysrgb&fit=crop&q=80&w=768 768w,
                        https://images.unsplash.com/photo-1617194191528-9a50cf609304?crop=entropy&cs=tinysrgb&fit=crop&q=80&w=1080 1080w
                    " sizes="(max-width: 767px) 0px, 50vw" width="1080" height="720" fetchpriority="high"
                    decoding="async" alt="Delicious food ready for delivery" />

            </div>

        </div>
    </div>
</section>
